packages:
  all:
  # note the compiler and providers specifications
  # only suggest a priority order, they do not exclude other options
  # suggested priority for compilers.
    providers:
      mpi: [ cray-mpich ]
      pkgconfig: [ pkg-config ]
      fftw-api : [ cray-fftw ]
      blas: [cray-libsci ]
      lapack : [cray-libsci ]
      scalapack : [ cray-libsci ]


    permissions:
      read: world
      write: user

# don't build virtuals with an external provider
  mpi:
    buildable: False
  blas:
    buildable: True
  lapack:
    buildable: True
  scalapack:
    buildable: True
  fftw-api:
    buildable: False
  netcdf-cxx:
    buildable: False
  netcdf95:
    buildable: False
  
  gcc:
    externals:
      - spec: gcc@=14.2
        extra_attributes:
          compilers:
            c: cc
            cxx: CC
            fortran: ftn
        modules:
          - cpe/25.03
          - PrgEnv-gnu/8.6.0
          - gcc-native/14.2
          - xpmem/0.2.119-1.3_gef379be13330
          - craype-x86-turin
          - craype-network-ofi
          - libfabric/1.22.0
          - craype-x86-turin
        
        extra_rpaths:
            - /opt/cray/libfabric/1.22.0/lib64/
            - /opt/xpmem/lib64/

      
      - spec: gcc@=14.2.1
        extra_attributes:
          compilers:
            c: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-14/root/usr/bin/g++
            fortran: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
  aocc:
    externals:
      - spec: aocc@=5.0.0
        extra_attributes:
          compilers:
            c: cc
            cxx: CC
            fortran: ftn
        modules:
          - cpe/25.03
          - PrgEnv-aocc/8.6.0
          - aocc/5.0.0
          - xpmem/0.2.119-1.3_gef379be13330
          - craype-x86-turin
          - craype-network-ofi
          - libfabric/1.22.0
          - craype-x86-turin
        
        extra_rpaths:
            - /opt/cray/libfabric/1.22.0/lib64/
            - /opt/xpmem/lib64/
  cce:
    externals:
      - spec: cce@=19.0.0
        extra_attributes:
          compilers:
            c: cc
            cxx: CC
            fortran: ftn
        modules:
          - PrgEnv-cray/8.6.0
          - cce/19.0.0
          - xpmem/0.2.119-1.3_gef379be13330
          - libfabric/1.22.0
          - craype-x86-turin
          - craype-network-ofi
        extra_rpaths:
          - /opt/cray/libfabric/1.22.0/lib64/
          - /opt/xpmem/lib64/
  
  intel-oneapi-compilers:
    externals:
      - spec: intel-oneapi-compilers@2025.0.4 -envmods
        extra_attributes:
          compilers:
            c: cc
            cxx: CC
            fortran: ftn
        modules:
          - PrgEnv-intel/8.6.0
          - craype/2.7.34
          - intel/2025.0
          - xpmem/0.2.119-1.3_gef379be13330
          - libfabric/1.22.0
          - craype-x86-turin
          - craype-network-ofi
        extra_rpaths:
          - /opt/cray/libfabric/1.22.0/lib64/
          - /opt/xpmem/lib64/

  netcdf-c:
    externals:
      - spec: netcdf-c@4.9.0.1+mpi %gcc
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/GNU/12.2/
      - spec: netcdf-c@4.9.0.1+mpi%cce
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/CRAYCLANG/18.0
      - spec: netcdf-c@4.9.0.1+mpi%aocc
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/AOCC/4.1/
      - spec: netcdf-c@4.9.0.1+mpi%intel-oneapi-compilers
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/INTEL/2023.2/
      
      
      
    
    buildable: False

  netcdf-fortran:
    externals:
      - spec: netcdf-fortran@4.9.0.17%gcc
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/GNU/12.2
      
      - spec: netcdf-fortran@4.9.0.17%cce
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/CRAYCLANG/18.0
      
      - spec: netcdf-fortran@4.9.0.17%aocc
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/AOCC/4.1/
      - spec: netcdf-fortran@4.9.0.17%intel-oneapi-compilers
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/INTEL/2023.2/

      
    buildable: False

  netcdf-cxx4:
    externals:
      - spec: netcdf-cxx4@4.9.0.17%gcc
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/GNU/12.2
      - spec: netcdf-cxx4@4.9.0.17%cce
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/CRAYCLANG/18.0
      
            
      - spec: netcdf-cxx4@4.9.0.17%aocc
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/AOCC/4.1/
      - spec: netcdf-cxx4@4.9.0.17%intel-oneapi-compilers
        modules:
          - cray-hdf5-parallel/1.14.3.5
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/netcdf-hdf5parallel/4.9.0.17/INTEL/2023.2/
      
    
    buildable: False
  

  parallel-netcdf:
    externals:
      - spec: parallel-netcdf@1.12.3.1%gcc
        modules:
          - cray-parallel-netcdf/1.12.3.17
        prefix: /opt/cray/pe/parallel-netcdf/1.12.3.17/GNU/12.2
      
      - spec: parallel-netcdf@1.12.3.17%cce
        modules:
          - cray-parallel-netcdf/1.12.3.17
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/parallel-netcdf/1.12.3.17/CRAYCLANG/18.0
      
      - spec: parallel-netcdf@1.12.3.1%aocc
        modules:
          - cray-parallel-netcdf/1.12.3.17
        prefix: /opt/cray/pe/parallel-netcdf/1.12.3.17/AOCC/4.1/
      
      - spec: parallel-netcdf@1.12.3.17%intel-oneapi-compilers
        modules:
          - cray-parallel-netcdf/1.12.3.17
          - cray-netcdf-hdf5parallel/4.9.0.17
        prefix: /opt/cray/pe/parallel-netcdf/1.12.3.17/INTEL/2023.2/
    
    buildable: False

  cray-mpich:
    externals:
    - spec: cray-mpich@8.1.32 +wrappers %gcc 
      modules:
      - cray-mpich/8.1.32
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/GNU/11.2

    - spec: cray-mpich@8.1.32 +wrappers %cce
      modules:
      - cray-mpich/8.1.32
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/CRAYCLANG/18.0
    
    - spec: cray-mpich@8.1.32 +wrappers %intel-oneapi-compilers
      modules:
      - cray-mpich/8.1.32
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/INTEL/2022.1/

    - spec: cray-mpich@8.1.32 +wrappers %aocc
      modules:
      - cray-mpich/8.1.32
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/AOCC/4.1/
    
    
    buildable: false
    

  hdf5:
    externals:
      - spec: hdf5@1.14.3.5+mpi%gcc
        modules:
          - cray-mpich/8.1.32
          - cray-hdf5-parallel/1.14.3.5
        prefix: /opt/cray/pe/hdf5-parallel/1.14.3.5/GNU/12.2

      - spec: hdf5@1.14.3.5+mpi%cce
        modules:
          - cray-mpich/8.1.32
          - cray-hdf5-parallel/1.14.3.5
        prefix: /opt/cray/pe/hdf5-parallel/1.14.3.5/CRAYCLANG/18.0     
      - spec: hdf5@1.14.3.5+mpi%intel-oneapi-compilers
        modules:
          - cray-mpich/8.1.32
          - cray-hdf5-parallel/1.14.3.5
        prefix: /opt/cray/pe/hdf5-parallel/1.14.3.5/INTEL/2023.2/
      
      - spec: hdf5@1.14.3.5+mpi%aocc
        modules:
          - cray-mpich/8.1.32
          - cray-hdf5-parallel/1.14.3.5
        prefix: /opt/cray/pe/hdf5-parallel/1.14.3.5/AOCC/4.1/
        
    buildable: False

  pkg-config:
    externals:
    - spec: pkg-config@1.7.3
      prefix: /usr
    buildable: false

  libfabric:
    externals:
    - spec: libfabric@1.12.1.2.2.0.0
      modules:
      - libfabric/1.22.0
      prefix: /opt/cray/libfabric/1.22.0
    buildable: false

  cray-fftw:
    externals:
    - spec: cray-fftw@3.3.10.10
      modules:
      - craype-x86-turin
      - cray-fftw/3.3.10.10
      prefix: /opt/cray/pe/fftw/3.3.10.10/x86_turin/
    buildable: false

  cray-libsci:
    externals:
      - spec: cray-libsci@25.03.0 %gcc
        modules:
        - cray-libsci/25.03.0
        prefix: /opt/cray/pe/libsci/25.03.0/GNU/12.2/x86_64/
      
      - spec: cray-libsci@25.03.0%cce
        modules:
        - cray-libsci/25.03.0
        prefix: /opt/cray/pe/libsci/25.03.0/CRAY/18.0/x86_64/
      
      - spec: cray-libsci@25.03.0 %aocc
        modules:
        - cray-libsci/25.03.0
        prefix: /opt/cray/pe/libsci/25.03.0/AOCC/4.1/x86_64/
      
      - spec: cray-libsci@25.03.0 %intel-oneapi-compilers
        modules:
        - cray-libsci/25.03.0
        prefix: /opt/cray/pe/libsci/25.03.0/INTEL/2025.0/x86_64/

  
  intel-oneapi-mkl:
    externals:
      - spec: intel-oneapi-mkl@2025.0.0 %intel-oneapi-compilers@2025.0.4 
        prefix: /opt/intel/oneapi
  
  python:
    prefer:
      - "@3.11.7"
    externals:
     - spec: python@3.11.7

       prefix: /opt/cray/pe/python/3.11.7
  
  py-numpy:
    externals:
     - spec: py-numpy@1.24.4
       prefix:  /opt/cray/pe/python/3.11.7


  py-mpi4py:
    externals:
     - spec: py-mpi4py@3.1.4
       prefix:  /opt/cray/pe/python/3.11.7
    buildable: false
    
  py-scipy:
    externals:
     - spec: py-scipy@1.10.1
       prefix:  /opt/cray/pe/python/3.11.7


  py-cython:
    externals:
     - spec: py-cython@0.29.36

       prefix:  /opt/cray/pe/python/3.11.7

  py-setuptools:
    externals:
     - spec: py-setuptools@70.0.0
       prefix:  /opt/cray/pe/python/3.11.7

  slurm:
    externals:
    - spec: slurm@25.05.4
      prefix: /usr
  openssl:
    externals:
    - spec: openssl@3.2.2
      prefix: /usr
  libxml2:
    externals:
    - spec: libxml2@2.9.13
      prefix: /usr
  hwloc:
    externals:
    - spec: hwloc@15.4.1
      prefix: /usr
  ncurses:
    externals:
    - spec: ncurses@6.2
      prefix: /usr
    require:
      - any_of:
        - "cflags='--for-linker --undefined-version' ldflags='--for-linker --undefined-version'"
        when: "%cce"
  
  alsa-lib:
    require:
      - any_of:
        - "cflags='--for-linker --undefined-version' ldflags='--for-linker --undefined-version'"
        when: "%cce"
