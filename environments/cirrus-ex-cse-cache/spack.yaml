# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.

spack:
  
  specs:
    - python@3.11.7
    - castep%gcc
    - quantum-espresso ^cmake@4 %gcc_all
    - openfoam-org%gcc
    - libxc%gcc
    - libxc%intel_all
    - py-torch  -cuda -rocm -valgrind ^openblas %gcc
    - python-venv %gcc_all
    - wannier90 %gcc_all
    - wannier90 %intel_all
    - lammps@20250612 +amoeba +asphere +bocs +body +bpm +brownian +cg-dna +cg-spica +class2 +colloid +colvars +compress +coreshell +dielectric +diffraction +dipole +dpd-basic +dpd-meso +dpd-react +dpd-smooth +drude +eff +electrode +extra-command +extra-compute +extra-dump +extra-fix +extra-molecule +extra-pair +fep +granular +interlayer +kspace +lepton +machdyn +manybody +mc +meam +mesont +misc +ml-iap +ml-pod +ml-snap +ml-uf3 +mofff +molecule +openmp +opt +orient +peri +phonon +plugin +qeq +reaction +reaxff +replica +rheo +rigid +shock +sph +spin +srd +tally +uef +voronoi +yaff %gcc_all 
    - cmake@4.1.2  %gcc_all
    - petsc@3.23.4 %gcc_all
    - petsc@3.23.4 %cce_all
    - metis %gcc_all
    - metis %aocc_all
    - metis %intel_all
    - metis %cce_all
    - parmetis %gcc_all
    - parmetis %intel_all
    - parmetis %cce_all
    - parmetis %aocc_all
    - eigen %gcc_all
    - eigen %cce_all
    - eigen %intel_all
    - eigen %aocc_all
    - likwid %gcc_all
    - cp2k@2025.2 +mpi +enable_regtests ^openblas ^amdscalapack %gcc_all
    - openfoam -cgal %gcc_all
    - tmux %gcc_all
    - petsc@3.23.4 %intel-oneapi-mkl %intel_all
    - petsc@3.23.4 -fortran %aocc_all
    - gromacs %gcc
    - subversion %gcc

  concretizer:
    unify: false
  config:
    install_tree:
      root: $spack/../cirrus-ex-cse/opt-cache
      padding_length: 128

  
  view: false
