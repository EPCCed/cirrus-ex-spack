  modules:
    default:
      'enable:':
      - lmod

      use_view: false
      roots:
        lmod: $spack/../cirrus-ex-cse/modules
      lmod:
        projections:
          all: '{name}/{version}'
          cce: '{name}-spack/{version}'
          gcc: '{name}-spack/{version}'
          
        exclude:
        - cray-mpich
        - cray-libsci
        - libfabric
        - fftw
        - hdf5
        - cray-fftw
        - parallel-netcdf
        - netcdf-cxx4
        - netcdf-fortran

        hash_length: 0
        core_compilers: [gcc@14.2.1,none]

        hide_implicits: true
        all:
          autoload: run
        
        core_specs:
          - python
          - py-protobuf
          - castep%gcc
          - gromacs%gcc
          - openfoam-org%gcc
          - openfoam
          - py-torch %gcc
          - py-pyyaml 
          - py-jinja2
          - py-markupsafe
          - cp2k
          - perl
          - likwid
          - tmux
          - quantum-espresso ^cmake@4 %gcc_all


        'hierarchy:':
        - compiler
      arch_folder: false
    prefix_inspections:
      ./lib:
      - LD_LIBRARY_PATH
      ./lib64:
      - LD_LIBRARY_PATH
