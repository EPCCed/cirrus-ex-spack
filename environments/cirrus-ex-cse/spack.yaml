# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.

spack:
  
  include:
  - $spack/../environments/cirrus-ex-cse/modules.yaml

  specs:
  - python@3.11.7
  - castep%gcc
  - cirrus_ex.quantum-espresso ^cmake@4 %gcc_all
  - openfoam-org%gcc
  - libxc%gcc
  - py-torch  -cuda -rocm -valgrind ^openblas %gcc
  - python-venv %gcc_all
  - wannier90 %gcc_all
  - lammps@20250612 %cce_all
  - lammps@20250612 %gcc_all
  - cmake@4.1.2  %gcc_all
  - petsc %gcc_all
  - petsc %cce_all
  - metis %gcc_all
  - parmetis %gcc_all
  - metis %cce_all
  - parmetis %cce_all
  - eigen %gcc_all
  - eigen %cce_all
  - likwid %gcc_all
  - cp2k %gcc_all

  concretizer:
    unify: false
    splice:
      automatic: false
  config:
    install_tree:
      root: $spack/../cirrus-ex-cse/opt
      padding_length: 120

  mirrors:
    licensed_packages: $spack/../cirrus-ex-cse/licensed_packages

  # packages:
    # castep:
    #   permissions:
    #     write: user
    #     read: group
    #     group: castep

  view: false
