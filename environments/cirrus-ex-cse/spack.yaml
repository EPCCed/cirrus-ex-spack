# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.

spack:

  include:
  - $spack/../environments/cirrus-ex-cse/modules.yaml

  specs:
  - python@3.11.7
  - castep%gcc
  - lammps%gcc
  - quantum-espresso%gcc
  - openfoam-org%gcc
  - libxc%gcc
  - py-torch  -cuda -rocm -valgrind ^openblas %gcc
  - python-venv %gcc_all
  - wannier90 %gcc_all
  - cirrus_ex.lammps@20250612 %cce_all

  concretizer:
    unify: false
    splice:
      automatic: false
  config:
    install_tree:
      root: $spack/../cirrus-ex-cse/opt
      padding_length: 120

  mirrors:
    licensed_packages: $spack/../cirrus-ex-cse/licensed_packages

  # packages:
    # castep:
    #   permissions:
    #     write: user
    #     read: group
    #     group: castep

  view: false
