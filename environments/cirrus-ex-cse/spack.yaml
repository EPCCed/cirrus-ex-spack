# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.

spack:
  
  include:
  - $spack/../environments/cirrus-ex-cse/modules.yaml

  specs:
  - python@3.11.7
  - castep%gcc
  - quantum-espresso ^cmake@4 %gcc_all
  - openfoam-org%gcc
  - libxc%gcc
  - py-torch  -cuda -rocm -valgrind ^openblas %gcc
  - python-venv %gcc_all
  - wannier90 %gcc_all
  - lammps@20250612 %cce_all
  - lammps@20250612 %gcc_all
  - cmake@4.1.2  %gcc_all
  - petsc@3.23.4 %gcc_all
  - petsc@3.23.4 %cce_all
  - metis %gcc_all
  - metis %aocc_all
  - metis %intel_all
  - metis %cce_all
  - parmetis %gcc_all
  - parmetis %intel_all
  - parmetis %cce_all
  - parmetis %aocc_all
  - eigen %gcc_all
  - eigen %cce_all
  - eigen %intel_all
  - eigen %aocc_all
  - likwid %gcc_all
  - cp2k@2025.2 +mpi +enable_regtests ^cray-libsci %gcc_all
  - cp2k@2025.2 +mpi +enable_regtests ^openblas ^amdscalapack %gcc_all
  - openfoam -cgal %gcc_all
  - tmux %gcc_all
  - petsc@3.23.4 %intel-oneapi-mkl %intel_all
  - petsc@3.23.4 -fortran %aocc_all

  concretizer:
    unify: false
    splice::
      automatic: false
  config:
    install_tree:
      root: $spack/../cirrus-ex-cse/opt
      padding_length: 120

  mirrors:
    licensed_packages: $spack/../cirrus-ex-cse/licensed_packages

  packages:
    castep:
      permissions:
        write: user
        read: group
        group: castep

  view: false
